name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly drift check against the deployed testnet contract spec.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  database-security:
    name: Database schema drift and RLS gates
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
      - run: supabase start
      - run: supabase db reset
      - run: npm run db:drift
      - run: npm run db:audit-rls
      - run: supabase stop
        if: always()

  integration:
    name: Integration tests (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
      - run: supabase start
      - run: npm run test:integration
      - run: supabase stop
        if: always()

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
      - run: supabase start
      - run: supabase db reset
      - run: npm run build
      - run: |
          npm run start > /tmp/nextjs.log 2>&1 &
          npx wait-on --timeout 60000 http://localhost:3000/card/11111111-1111-1111-1111-111111111111
          npx lhci collect --url=http://localhost:3000/card/11111111-1111-1111-1111-111111111111
          npx lhci assert
      - run: supabase stop
        if: always()

      - run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
      - run: supabase start
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: supabase stop
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          version: latest

      - name: Start database and apply migrations
        run: supabase db start

      - name: Generate Record of Processing Activities
        run: node scripts/generate-ropa.mjs

      - name: Fail if committed RoPA is stale
        run: |
          if ! git diff --exit-code -- docs/compliance/ropa.md; then
            echo "::error::docs/compliance/ropa.md is stale. Run 'node scripts/generate-ropa.mjs' and commit the result."
            exit 1
          fi
