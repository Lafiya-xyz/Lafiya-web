name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Dummy, non-secret values so lib/env.ts's zod validation passes at build
  # time — next build loads every route's module graph (even dynamic ones)
  # to collect its config, which runs this validation whether or not the
  # route is ever rendered during the build itself.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build-only
  SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key-for-build-only
  STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
  SOROBAN_RPC_URL: https://soroban-testnet.stellar.org

jobs:
  test:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run migration:lint
      - run: npm test
      - run: npm run build
      - name: Verify no client bundle leaks
        run: node scripts/check-client-bundles.js

  integration:
    name: Integration tests (local Supabase)
    runs-on: ubuntu-latest
    # Overrides the workflow-level dummy Supabase keys above (those are
    # build-time-only placeholders — see the comment on the top-level `env:`
    # block) with the real local-dev demo keys the running `supabase start`
    # instance actually accepts, matching the e2e/performance jobs below.
    # Without this, vitest.integration.config.ts's `.env.test` loading is a
    # no-op: `process.loadEnvFile()` does not override an already-set
    # process.env var, so every admin-client call in the suite fails with
    # "invalid JWT: ... token contains an invalid number of segments"
    # against the literal string "dummy-service-role-key-for-build-only".
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
      - run: supabase start
      - run: npm run test:integration
      - run: supabase stop
        if: always()

  performance:
    name: Performance (Lighthouse CI)
    runs-on: ubuntu-latest
    needs: test
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
      - run: supabase start
      - run: supabase db reset
      - run: npm run build
      - run: |
          npm run start > /tmp/nextjs.log 2>&1 &
          npx wait-on --timeout 60000 http://localhost:3000/card/11111111-1111-1111-1111-111111111111
          npx lhci collect --url=http://localhost:3000/card/11111111-1111-1111-1111-111111111111
          npx lhci assert
      - run: supabase stop
        if: always()

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
      - run: supabase start
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: supabase stop
        if: always()
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
