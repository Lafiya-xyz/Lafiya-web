name: Contract schema compatibility

on:
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/check-schema-compat.mjs"

permissions:
  contents: read

jobs:
  schema-compat:
    name: Contract schema evolution gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: node scripts/check-schema-compat.mjs --base "origin/${{ github.base_ref }}"
