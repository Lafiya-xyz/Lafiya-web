name: Supply chain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  verify:
    name: Dependency, action, secret, and provenance checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ci:check-action-pins
      - run: npm audit --omit=dev --audit-level=high
      - uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          extra_args: --only-verified
      - run: npm run sbom
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          subject-path: artifacts/lafiya-web.sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lafiya-web-sbom
          path: artifacts/lafiya-web.sbom.cdx.json
          retention-days: 30
