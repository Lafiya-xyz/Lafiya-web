name: Supply chain

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'release-*'

# Scorecard Token-Permissions: least privilege at the top level, write scopes
# granted only to the jobs that need them.
permissions:
  contents: read

jobs:
  verify:
    name: Dependency, action, secret, and provenance checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ci:check-action-pins
      - run: npm audit --omit=dev --audit-level=high
      - uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: ./
          extra_args: --only-verified
      - name: Gate scanner findings against VEX
        run: |
          mkdir -p artifacts
          npm audit --omit=dev --json > artifacts/npm-audit.json || true
          npm run vex:gate
      - run: npm run sbom
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          subject-path: artifacts/lafiya-web.sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lafiya-web-sbom
          path: |
            artifacts/lafiya-web.sbom.cdx.json
            artifacts/lafiya-web.vex.openvex.json
            artifacts/npm-audit.json
          retention-days: 30

  verify-tag-signatures:
    name: Verify release tag signatures
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch tags
        run: git fetch --force --tags origin
      - name: Verify release tag signatures against allowlist
        env:
          # Comma-separated allowlist of maintainer signing identities:
          # GPG key fingerprints and/or SSH signer principals.
          ALLOWED_SIGNERS: ${{ vars.RELEASE_SIGNERS }}
        run: |
          set -euo pipefail

          if [ -z "${ALLOWED_SIGNERS:-}" ]; then
            echo "::error::RELEASE_SIGNERS repository variable is not set; cannot verify tag signatures."
            exit 1
          fi

          # Normalize the allowlist into a newline-separated list of identities.
          allowed=$(printf '%s' "$ALLOWED_SIGNERS" | tr ',' '\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | grep -v '^$' || true)
          if [ -z "$allowed" ]; then
            echo "::error::RELEASE_SIGNERS is empty; cannot verify tag signatures."
            exit 1
          fi

          # Collect release tags to verify: the pushed tag on tag events, all
          # release tags on pull requests.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tags="$GITHUB_REF_NAME"
          else
            tags=$(git tag --list 'v*' 'release-*')
          fi

          if [ -z "$tags" ]; then
            echo "No release tags to verify."
            exit 0
          fi

          failed=0
          for tag in $tags; do
            echo "::group::Verifying signature for $tag"
            if ! verify_output=$(git tag -v "$tag" 2>&1); then
              echo "$verify_output"
              echo "::error::Tag $tag is not signed or its signature could not be verified."
              failed=1
              echo "::endgroup::"
              continue
            fi
            echo "$verify_output"

            # Extract the signing identity from the verification output. GPG
            # reports a fingerprint, SSH reports the signer principal.
            identity=$(printf '%s\n' "$verify_output" | sed -n -e 's/^.*Primary key fingerprint:[[:space:]]*//p' -e 's/^.*Good "git" signature for[[:space:]]*//p' | head -n1 | sed -e 's/[[:space:]]*$//')
            if [ -z "$identity" ]; then
              echo "::error::Could not determine signing identity for tag $tag."
              failed=1
              echo "::endgroup::"
              continue
            fi

            matched=0
            while IFS= read -r signer; do
              case "$identity" in
                *"$signer"*) matched=1 ;;
              esac
            done <<< "$allowed"

            if [ "$matched" -ne 1 ]; then
              echo "::error::Tag $tag is signed by '$identity', which is not in the allowlist."
              failed=1
            fi
            echo "::endgroup::"
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more release tags failed signature verification."
            exit 1
          fi
          echo "All release tags are signed by allowlisted identities."

  dependency-health:
    name: New dependency health summary
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - id: health
        run: node scripts/dependency-health.mjs --base "origin/${{ github.base_ref }}" --markdown dependency-health.md
      - if: always()
        run: cat dependency-health.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        with:
          script: |
            const body = require('fs').readFileSync('dependency-health.md', 'utf8');
            if (body.includes('No dependencies to review.')) return;
            const marker = '<!-- dependency-health -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            const payload = { owner, repo, body: `${marker}\n${body}` };
            if (existing) await github.rest.issues.updateComment({ ...payload, comment_id: existing.id });
            else await github.rest.issues.createComment({ ...payload, issue_number });
