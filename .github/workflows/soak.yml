name: Soak test

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Soak duration in minutes (30-60)"
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  soak:
    name: Memory and handle soak
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run soak
        env:
          DURATION_MINUTES: ${{ inputs.duration_minutes || '30' }}
          SOAK_SAMPLES: "120"
        run: SOAK_DURATION_MS=$((DURATION_MINUTES * 60000)) npm run test:soak
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: soak-trends
          path: artifacts/soak/
          retention-days: 30
