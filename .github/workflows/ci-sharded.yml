name: Sharded tests

# Issue #777: shard Vitest and Playwright across matrix runners, merge
# coverage (feeding the coverage ratchet) and HTML reports, and enforce a CI
# duration budget. See docs/ci-sharding.md for timings and the budget.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-sharded-${{ github.ref }}
  cancel-in-progress: true

env:
  VITEST_SHARDS: 4
  PLAYWRIGHT_SHARDS: 3
  # Wall-clock budget in minutes for the whole workflow (docs/ci-sharding.md).
  CI_DURATION_BUDGET_MINUTES: 20

jobs:
  unit:
    name: Vitest shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false "@vitest/coverage-v8@$(node -p "require('vitest/package.json').version")"
      # Thresholds are enforced once on the merged coverage, not per shard.
      - run: >-
          npx vitest run --shard=${{ matrix.shard }}/${{ env.VITEST_SHARDS }}
          --reporter=blob --reporter=default --coverage --coverage.thresholds=false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          retention-days: 1

  unit-merge:
    name: Merge Vitest coverage
    needs: unit
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false "@vitest/coverage-v8@$(node -p "require('vitest/package.json').version")"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vitest-blob-*
          path: .vitest/blob
          merge-multiple: true
      # Re-applies the configured per-directory thresholds to merged coverage.
      - run: npx vitest run --merge-reports --coverage
      - run: node scripts/coverage-ratchet.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage
          retention-days: 14

  e2e:
    name: Playwright shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: versions
        run: echo "playwright=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.versions.outputs.playwright }}
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: supabase-cache
        with:
          path: ~/supabase-images.tar
          key: supabase-images-${{ runner.os }}-${{ hashFiles('supabase/config.toml', 'package-lock.json') }}
      - run: docker load -i ~/supabase-images.tar
        if: steps.supabase-cache.outputs.cache-hit == 'true'
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
      - run: supabase start
      - name: Save Supabase images for the cache
        if: steps.supabase-cache.outputs.cache-hit != 'true'
        run: docker save $(docker images --format '{{.Repository}}:{{.Tag}}' | grep supabase) -o ~/supabase-images.tar
      - run: npx playwright test --shard=${{ matrix.shard }}/${{ env.PLAYWRIGHT_SHARDS }} --reporter=blob
      - run: supabase stop
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

  e2e-merge:
    name: Merge Playwright reports
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: playwright-blob-*
          path: all-blob-reports
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      # Flaky-test detection across shards: tests that passed only on retry.
      - name: Report flaky tests
        run: |
          npx playwright merge-reports --reporter json ./all-blob-reports > merged-report.json
          node -e '
            const report = require("./merged-report.json");
            const flaky = [];
            const walk = (suite) => {
              for (const spec of suite.specs ?? []) for (const test of spec.tests)
                if (test.status === "flaky") flaky.push(`${spec.file}: ${spec.title}`);
              for (const child of suite.suites ?? []) walk(child);
            };
            report.suites.forEach(walk);
            const lines = flaky.length ? flaky.map((t) => `- ${t}`) : ["No flaky tests."];
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, ["## Flaky tests", ...lines].join("\n") + "\n");
            for (const t of flaky) console.log(`::warning::Flaky test: ${t}`);
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 14

  duration-budget:
    name: CI duration budget
    needs: [unit-merge, e2e-merge]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Alert when the run exceeds the budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          minutes=$(( ($(date -u +%s) - $(date -u -d "$started" +%s)) / 60 ))
          echo "## CI duration: ${minutes} min (budget ${CI_DURATION_BUDGET_MINUTES} min)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$minutes" -gt "$CI_DURATION_BUDGET_MINUTES" ]; then
            echo "::error::CI took ${minutes} min, over the ${CI_DURATION_BUDGET_MINUTES} min budget (docs/ci-sharding.md)."
            exit 1
          fi
