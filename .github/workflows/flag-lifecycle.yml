name: Feature flag lifecycle

on:
  pull_request:
  schedule:
    # Weekly stale/expired flag report (issue #788).
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Check flag references and expiry
        if: github.event_name == 'pull_request'
        run: node scripts/check-flags.mjs
      - name: Open tracking issues for expired flags
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-flags.mjs --create-issues
