name: Doc snippets

# Issue #780: run annotated code blocks in docs/ (see docs/doc-snippet-tests.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  doc-snippets:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: doctest
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run docs:snippets -- --require-sql
        env:
          DOCTEST_DATABASE_URL: postgres://postgres:doctest@localhost:5432/postgres
