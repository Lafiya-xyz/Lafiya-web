name: Low-end perf lab

# Issue #778: emulated low-end Android (6x CPU, slow-4G, capped heap) against
# the budgets in perf/low-end-budgets.json. Traces are uploaded as artifacts
# and linked from the job summary.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  perf-lab:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
      SUPABASE_SERVICE_ROLE_KEY: dummy
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      LAFIYA_DEPLOYMENT_ENV: ci
      ATTESTATION_MODE: mock
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
      - run: supabase start
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: |
          npm run start > /tmp/nextjs.log 2>&1 &
          npx wait-on --timeout 60000 http://localhost:3000
      - run: npm run perf:lab
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: perf-lab-traces
          path: artifacts/perf-lab/
          retention-days: 14
      - run: supabase stop
        if: always()
